[project]
name = "return-risk"
version = "0.1.0"
description = "Return/abuse risk at checkout - feature catalog and return-risk model"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_catalog"]

[tool.pytest.ini_options]
# Repo root on sys.path so first-party packages import without packaging.
pythonpath = ["."]
testpaths = ["feature_catalog", "models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
